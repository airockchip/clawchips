[server]
host = "0.0.0.0"
port = 8081
queue_size = 32
enable_streaming = true

[runtime]
target = "rk1820"
device_id = "0003:31:00.0"
core_mask = 255
native_library = ""

[model]
id = "CoPaw-4B-Flash"
rknn_path = "/userdata/CoPaw-4B-RKNN-ZF/CoPaw-flash-4B-llm-fuse.rknn"
weight_path = "/userdata/CoPaw-4B-RKNN-ZF/CoPaw-flash-4B-llm-fuse.weight"
tokenizer_path = "/userdata/CoPaw-4B-RKNN-ZF/CoPaw-4B.tokenizer.gguf"
embed_path = "/userdata/CoPaw-4B-RKNN-ZF/CoPaw-4B.embed.bin"
chat_template_file = ""
max_context_tokens = 43008
max_new_tokens = 4096
enable_thinking = true
clear_kv_cache = false
kv_cache_dir = "/userdata/kv_cache"
kv_cache_system_marker = "## Runtime\nLinux aarch64, Python 3.11.2"

[sampling]
temperature = 0.3
top_p = 0.95
top_k = 1
repeat_penalty = 1.1
frequency_penalty = 0.0
presence_penalty = 0.0

[reasoning]
separate_output = true
fallback_delimiter = "\n\n\n"

[tool_call_correction]
enabled = false

[xgrammar]
enabled = true
model_structure = "qwen3.5"
debug = false

[native_sampling]
enabled = true
# -1 chooses a fresh native sampler seed for each request.
seed = -1
# Number of generated tokens tracked by repeat penalty.
repeat_last_n = 64

[logging]
debug_logs = true
# Optional detail log targets: off, logger, file, both.
# If omitted, debug_logs=true defaults all four to logger; debug_logs=false defaults them to off.
logger_detail_log_max_chars = 4096
openai_request_log = "off"
llm_input_log = "logger"
llm_output_log = "logger"
openai_response_log = "off"
