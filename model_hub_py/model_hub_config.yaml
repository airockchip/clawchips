devices:
  - name: rk3588
    type: rknpu
    max_concurrency: 3
    scheduling_timeout_seconds: 45
    resume_window_seconds: 300
  - name: rk1828
    type: rk182x
    max_concurrency: 1
    scheduling_timeout_seconds: 45
    resume_window_seconds: 300
services:
  - name: embeding
    device: rk3588
    startup_mode: always
    device_memory_usage: 4000MB
    base_url: http://127.0.0.1:18080
    start_command: "systemctl start embedding-rknn-server.service"
    stop_command: "systemctl stop embedding-rknn-server.service"
    healthcheck_command: curl -fsS http://127.0.0.1:18080/health
    startup_timeout_seconds: 300
    result_ttl_seconds: 60
  - name: qwen3-4b-instruct-2507
    device: rk1828
    startup_mode: always
    device_memory_usage: 4700MB
    base_url: http://127.0.0.1:18088
    start_command: "systemctl start rkllm-qwen3-4b-instruct-2507-server.service"
    stop_command: "systemctl stop rkllm-qwen3-4b-instruct-2507-server.service"
    healthcheck_command: curl -fsS http://127.0.0.1:18088/health
    startup_timeout_seconds: 300
    result_ttl_seconds: 60
  - name: qwen3-vl-2b
    device: rk1828
    startup_mode: always
    device_memory_usage: 1600MB
    base_url: http://127.0.0.1:18001
    start_command: "systemctl start rkllm-vl-server.service"
    stop_command: "systemctl stop rkllm-vl-server.service"
    healthcheck_command: curl -fsS http://127.0.0.1:18001/health
    startup_timeout_seconds: 120
    result_ttl_seconds: 60
  - name: rk-asr
    device: rk1828
    startup_mode: always
    device_memory_usage: 2110MB
    base_url: http://127.0.0.1:18002
    start_command: "systemctl start rk-asr-server.service"
    stop_command: "systemctl stop rk-asr-server.service"
    healthcheck_command: curl -fsS http://127.0.0.1:18002/health
    startup_timeout_seconds: 120
    result_ttl_seconds: 60
  - name: rk-tts
    device: rk1828
    startup_mode: once
    device_memory_usage: 1830MB
    base_url: http://127.0.0.1:18003
    start_command: "cd /userdata/model_hub/rk-tts/rocktts_linux_aarch64_rk3588 && ./start_tts_server.sh"
    stop_command: "cd /userdata/model_hub/rk-tts/rocktts_linux_aarch64_rk3588 && ./stop_tts_server.sh"
    healthcheck_command: curl -fsS http://127.0.0.1:18003/health
    startup_timeout_seconds: 120
    result_ttl_seconds: 60
