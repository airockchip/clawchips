[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model_hub_py"
version = "0.6.0"
description = "Single-host model service scheduler and HTTP gateway"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.2"]

[project.scripts]
model-hub-py = "model_hub_py.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
