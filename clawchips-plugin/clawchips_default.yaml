# router.rules: LOCAL / CLOUD / default must resolve to OpenClaw provider/model.
# Prefer `provider/model-id` (same as models.providers in ~/.openclaw/openclaw.json); then you need not configure llms.
# If you use short names only (e.g. Qwen3.5-4B), declare models per provider under llms below.
# For interactive setup, run scripts/setup.mjs manually; otherwise copy this file to ~/.openclaw/clawchips.yaml.
router:
  enable: false
  strategy: rules
  rules:
  - LOCAL: rkllm/Qwen3-4B
  - CLOUD: openrouter/anthropic/claude-3.5-sonnet
  - default: rkllm/Qwen3-4B
memory:
  enabled: false
  top_k: 10
  score_threshold: 0.75
  max_query_chars: 500
  max_prompt_chars: 200
  per_user: false
embedding:
  type: openai-compatible
  provider: rknn-embedding-server
  model: rknn-embedding
  endpoint: http://localhost:18080
  dimensions: 2560
  # api_key: sk-xxx
  # api_key_env: OPENAI_API_KEY
# Optional QQ proactive notifications on tool calls (requires QQ Bot plugin when enabled).
qq_tool_notify:
  enabled: false
  type: c2c
  account_id: default
  on_before: false
  on_after: true
  max_param_chars: 500
  max_result_chars: 400
storage:
  max_prompt_chars: 200
